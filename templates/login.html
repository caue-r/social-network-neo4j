{% extends "base.html" %}
{% block content %}
  <section class="auth-section">
    <h2>Entrar na rede</h2>
    <p>Acesse sua conta para interagir com a rede social Neo4j.</p>
    <form method="post" action="{{ url_for('login') }}" class="auth-form">
      <label for="login-identifier">Usuário ou email</label>
      <input id="login-identifier" name="identifier" placeholder="seu usuário/email" required>

      <label for="login-password">Senha</label>
      <input id="login-password" name="password" type="password" required>

      <button type="submit">Entrar</button>
    </form>
    <div class="auth-links">
      <a class="secondary-button" href="{{ url_for('register_page') }}">Criar conta</a>
    </div>
  </section>
{% endblock %}
