{% extends "base.html" %}
{% block content %}
  <section>
    <h2>Entrar na rede</h2>
    <p>Cadastre-se ou faça login para acessar as ações da rede.</p>
    <div class="auth-grid">
      <div class="auth-card">
        <h3>Cadastre-se</h3>
        <form method="post" action="{{ url_for('register') }}">
          <label for="register-name">Nome completo</label>
          <input id="register-name" name="name" placeholder="ex: Maria Silva" required>

          <label for="register-email">Email</label>
          <input id="register-email" name="email" type="email" placeholder="voce@email.com" required>

          <label for="register-username">Usuário</label>
          <input id="register-username" name="username" placeholder="ex: maria" required>

          <label for="register-password">Senha</label>
          <input id="register-password" name="password" type="password" minlength="4" required>

          <button type="submit">Criar conta</button>
        </form>
      </div>

      <div class="auth-card">
        <h3>Já tenho conta</h3>
        <form method="post" action="{{ url_for('login') }}">
          <label for="login-identifier">Usuário ou email</label>
          <input id="login-identifier" name="identifier" placeholder="seu usuário/email" required>

          <label for="login-password">Senha</label>
          <input id="login-password" name="password" type="password" required>

          <button type="submit">Entrar</button>
        </form>
      </div>
    </div>
  </section>
{% endblock %}
